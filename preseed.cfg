# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string dvm
d-i netcfg/get_domain string local

# Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account setup
# Root password (hashed using `openssl passwd -6 pass`)
d-i passwd/root-login boolean true
d-i passwd/root-password password pass
d-i passwd/root-password-again password pass
# User account
d-i passwd/make-user boolean true
d-i passwd/user-fullname string User
d-i passwd/username string user
d-i passwd/user-password password pass
d-i passwd/user-password-again password pass

# Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning (Single Btrfs partition, no swap)
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
      swapless-btrfs :: \
        1000 10000 -1 btrfs \
          $primary{ } \
          $bootable{ } \
          method{ format } \
          format{ } \
          use_filesystem{ } \
          filesystem{ btrfs } \
          mountpoint{ / } \
        .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-partitioning/no_bootable_gpt_biosgrub boolean false
d-i partman-partitioning/no_bootable_gpt_efi boolean false

# Base system & package selection
d-i base-installer/kernel/override-image string linux-server
d-i base-installer/initramfs-tools/driver-policy select targeted
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/enable-source-repositories boolean false

# Software selection (SSH server only)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo python3
d-i popularity-contest/participate boolean true

# Bootloader installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# Finishing the installation
d-i finish-install/reboot_in_progress note
