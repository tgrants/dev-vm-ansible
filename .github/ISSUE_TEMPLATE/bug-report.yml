name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Specify the dvm version.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the problem, if applicable.
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Other Information
      description: Any other context or additional information.
    validations:
      required: false
