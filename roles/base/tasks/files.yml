---

- name: Create dvm directory
  file:
    path: "/etc/dvm"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create dvm config
  ansible.builtin.template:
    src: "dvm.conf.j2"
    dest: "/etc/dvm/dvm.conf"
    mode: '0766'
  become: true

- name: Create projects directory
  file:
    path: "/home/{{ username }}/Projects"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
  become: true

- name: Create scripts from templates into /usr/local/bin
  ansible.builtin.template:
    src: "{{ item.Name }}{{ item.Extension }}.j2"
    dest: "/usr/local/bin/{{ item.Name }}"
    mode: "0755"
  loop: "{{ scripts }}"

- name: Create scripts from templates into /usr/local/sbin
  ansible.builtin.template:
    src: "{{ item.Name }}{{ item.Extension }}.j2"
    dest: "/usr/local/sbin/{{ item.Name }}"
    mode: "0755"
  loop: "{{ su_scripts }}"
