packages:
  - gpg
  - python3-requests
  - unzip
  - wget

# Scripts without a description are not added to the README
# 'scripts' are copied to /usr/local/bin
scripts:
  - Name: sysprep
    Extension: .sh
    Description: "Prepares the sytem for distribution"
# - Name: clear-tmp
#   Extension: .sh
  - Name: combine
    Extension: .py
  - Name: dvmconf
    Extension: .py
    Description: "Edits dvm settings"
  - Name: install-github-cli
    Extension: .sh
    Description: "Installs and prepares Github cli"
  - Name: install-mariadb
    Extension: .sh
    Description: "Installs mariadb and php-mysql"
# - Name: install-node-npm
#   Description: "Installs node.js and npm"

# 'su_scripts' are copied to /usr/local/sbin
su_scripts: []
# - Name: generate-id
#   Extension: .sh
