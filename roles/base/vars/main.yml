packages:
  - figlet
  - gpg
  - python3-requests
  - unzip
  - wget

# Scripts without a description are not added to the README
# 'scripts' are copied to /usr/local/bin
scripts:
  - Name: combine
    Extension: .py
  - Name: dvmconf
    Extension: .py
    Description: "Edits dvm settings"
  - Name: install-github-cli
    Extension: .sh
    Description: "Installs and prepares Github cli"
  - Name: install-mariadb
    Extension: .sh
    Description: "Installs mariadb and php-mysql"

# 'su_scripts' are copied to /usr/local/sbin
su_scripts:
  - Name: remove-kernels
    Extension: .sh
    Description: "Remove all installed kernels except the one in use"
  - Name: sysprep
    Extension: .sh
    Description: "Prepares the sytem for distribution"
