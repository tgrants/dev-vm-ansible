---

- name: restart sshd
  service:
    name: sshd
    state: restarted

- name: Remount root
  ansible.builtin.command:
    cmd: mount -o remount,compress=zstd:3 /
  changed_when: true

- name: Mark filesystem recompressed
  ansible.builtin.file:
    path: /etc/dvm/.btrfs_recompressed
    state: touch

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Update GRUB
  ansible.builtin.command: update-grub
